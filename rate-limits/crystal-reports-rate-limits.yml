specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Crystal Reports
providerId: crystal-reports
created: '2026-05-04'
# Provenance stamped 2026-08-11: this artifact was written by the API Evangelist
# bulk sweep dated 2026-05-04, not harvested from the provider. See roadmap#35.
method: generated
modified: '2026-05-05'
reconciled: false
tags:
  - Business Intelligence
  - Reporting
  - SAP
  - Rate Limiting
description: Crystal Reports / BusinessObjects REST APIs are server-deployed (customer-managed); throughput
  is bounded by the deployment's CMS / processing-server sizing rather than by SAP-imposed quotas. Limits
  are not published as numeric thresholds.
sources:
  - https://www.sap.com/products/technology-platform/crystal-reports.html
notes: No public, vendor-imposed rate limits exist for Crystal Reports / BI Platform; throughput depends
  on customer-deployed CMS, App Server, and Processing Server capacity.
responseCodes:
  throttled: 429
  serviceUnavailable: 503
limits:
  - name: BI Platform REST throughput
    scope: deployment
    metric: varies
    limit: bounded by customer-deployed CMS / App Server / Processing Server capacity
    applies:
      - Crystal Reports REST API
      - Crystal Reports Server REST API
  - name: Crystal Reports SDK
    scope: process
    metric: varies
    limit: bounded by host process and licensed concurrent users
    applies:
      - Crystal Reports SDK
policies:
  - name: Sizing-driven capacity
    description: Plan concurrent report and scheduling capacity using SAP's BI Platform sizing guides
      rather than a vendor-imposed RPS.
  - name: Backoff on 503
    description: When the Processing Server is saturated, requests return 503; clients should back off
      and retry with jitter.
maintainers:
