naftiko: 1.0.0-alpha2
info:
  label: SAP Crystal Reports RESTful Web Services API — Export
  description: 'SAP Crystal Reports RESTful Web Services API — Export. 1 operations. Lead operation: Crystal Reports Export
    Report to Specified Format. Self-contained Naftiko capability covering one Crystal Reports business surface.'
  tags:
  - Crystal Reports
  - Export
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    CRYSTAL_REPORTS_API_KEY: CRYSTAL_REPORTS_API_KEY
capability:
  consumes:
  - type: http
    namespace: rest-export
    baseUri: http://{host}:{port}/biprws
    description: SAP Crystal Reports RESTful Web Services API — Export business capability. Self-contained, no shared references.
    resources:
    - name: infostore-reportId-rpt-export
      path: /infostore/{reportId}/rpt/export
      operations:
      - name: exportreport
        method: GET
        description: Crystal Reports Export Report to Specified Format
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: mime_type
          in: query
          type: string
          description: The MIME type of the desired export format
          required: true
        - name: startPageNumber
          in: query
          type: integer
          description: Starting page number for the export (PDF only)
        - name: endPageNumber
          in: query
          type: integer
          description: Ending page number for the export (PDF only)
        - name: isCreateBookmarksFromGroupTree
          in: query
          type: boolean
          description: Whether to create bookmarks from the group tree (PDF only)
    authentication:
      type: apikey
      key: X-SAP-LogonToken
      value: '{{env.CRYSTAL_REPORTS_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: rest-export-rest
    port: 8080
    description: REST adapter for SAP Crystal Reports RESTful Web Services API — Export. One Spectral-compliant resource per
      consumed operation, prefixed with /v1.
    resources:
    - path: /v1/infostore/{reportid}/rpt/export
      name: infostore-reportid-rpt-export
      description: REST surface for infostore-reportId-rpt-export.
      operations:
      - method: GET
        name: exportreport
        description: Crystal Reports Export Report to Specified Format
        call: rest-export.exportreport
        with:
          mime_type: rest.mime_type
          startPageNumber: rest.startPageNumber
          endPageNumber: rest.endPageNumber
          isCreateBookmarksFromGroupTree: rest.isCreateBookmarksFromGroupTree
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: rest-export-mcp
    port: 9090
    transport: http
    description: MCP adapter for SAP Crystal Reports RESTful Web Services API — Export. One tool per consumed operation, routed
      inline through this capability's consumes block.
    tools:
    - name: crystal-reports-export-report-specified
      description: Crystal Reports Export Report to Specified Format
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: rest-export.exportreport
      with:
        mime_type: tools.mime_type
        startPageNumber: tools.startPageNumber
        endPageNumber: tools.endPageNumber
        isCreateBookmarksFromGroupTree: tools.isCreateBookmarksFromGroupTree
      outputParameters:
      - type: object
        mapping: $.
