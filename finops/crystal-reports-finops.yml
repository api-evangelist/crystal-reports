tags:
  - Business Intelligence
  - Reporting
  - SAP
  - FinOps
  - FOCUS
description: 'FOCUS-aligned FinOps for SAP Crystal Reports: per-named-user desktop license plus server
  / BI Platform license. Pricing is partner-quoted; APIs are entitlements of the underlying license rather
  than separately metered.'
sources:
  - https://www.sap.com/products/technology-platform/crystal-reports.html
notes: Pricing is not public; reconcile per-seat and per-CPU costs from the active SAP partner contract.
principles:
  - name: Visibility
    description: Use the SAP BI Platform CMS to inventory deployed Crystal Reports designers and report
      authors; reconcile against the SAP entitlement portal.
  - name: Allocation
    description: Tag report authors and folders by department to attribute Crystal Reports designer and
      server seat costs.
  - name: Optimization
    description: Reclaim dormant designer seats; prefer concurrent-user licensing over named-user when
      utilization is low; consolidate to BI Platform shared services.
  - name: Accountability
    description: BI / data-platform org owns the SAP contract; finance reviews annual maintenance and
      true-up at SAP renewal.
domains:
  - name: Understand Usage and Cost
    capabilities:
      - Allocation
      - Reporting and Analytics
  - name: Quantify Business Value
    capabilities:
      - Forecasting
      - Budgeting
  - name: Optimize Usage and Cost
    capabilities:
      - Licensing and SaaS
  - name: Manage the FinOps Practice
    capabilities:
      - Invoicing and Chargeback
billingModel:
  pricingCategory: Perpetual License + Maintenance
  billingFrequency: Annual
  billingCurrency: USD
  chargeCategories:
    - Purchase
    - Tax
    - Adjustment
  chargeFrequency: One-Time + Recurring
focusColumns:
  ServiceName: SAP Crystal Reports
  ServiceCategory: Business Intelligence
  ProviderName: SAP
  PublisherName: SAP SE
  InvoiceIssuerName: SAP SE
  PricingCategory: Perpetual License
  PricingUnit: seat
  BillingCurrency: USD
  ChargeCategory: Purchase
meters:
  - name: designer_seats
    description: Crystal Reports designer / authoring seats
    unit: seat-year
    aggregation: max
    dimensions:
      - department
  - name: server_seats
    description: BI Platform / Crystal Server named or concurrent user seats
    unit: seat-year
    aggregation: max
    dimensions:
      - department
      - environment
  - name: maintenance_fees
    description: Annual SAP support / maintenance entitlement
    unit: year
    aggregation: sum
    dimensions:
      - product
apis:
