openapi: 3.0.3
info:
  title: SAP Crystal Reports RESTful Web Services API
  description: >-
    RESTful web services API for SAP Crystal Reports, providing access to
    report viewing, exporting, data retrieval via OData, and repository
    navigation through the SAP BusinessObjects BI Platform.
  version: 4.3.0
  contact:
    name: SAP
    url: https://www.sap.com
  license:
    name: Proprietary
    url: https://www.sap.com/about/legal/copyright.html
  x-generated-from: documentation
  x-source-url: https://help.sap.com/doc/sapcrystalreportsrestfulwebservices/4.3/en-US/crrest_api_42SP2.pdf
servers:
  - url: http://{host}:{port}/biprws
    description: SAP BusinessObjects BI Platform REST API server
    variables:
      host:
        default: localhost
        description: Hostname of the SAP BusinessObjects server
      port:
        default: '6405'
        description: Port number for the RESTful web services
security:
  - sapLogonToken: []
tags:
  - name: Authentication
    description: Logon and session management
  - name: Repository
    description: Infostore repository navigation and folder browsing
  - name: Reports
    description: Report summary and URI information
  - name: Metadata
    description: Report structure and metadata
  - name: Instances
    description: Transient report instance management
  - name: Export
    description: Report export to various formats
  - name: OData
    description: OData data service for report row and summary data
paths:
  /logon/long:
    get:
      operationId: getLogonForm
      summary: Get logon form template
      description: >-
        Returns a JSON or XML template for the logon request body,
        showing the required fields for authentication.
      tags:
        - Authentication
      security: []
      parameters:
        - $ref: '#/components/parameters/Accept'
      responses:
        '200':
          description: Logon form template returned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogonRequest'
            application/xml:
              schema:
                $ref: '#/components/schemas/LogonRequest'
      x-microcks-operation:
        delay: 100
    post:
      operationId: logon
      summary: Authenticate with username and password
      description: >-
        Authenticates a user against the SAP BusinessObjects BI Platform
        and returns an X-SAP-LogonToken header for subsequent requests.
      tags:
        - Authentication
      security: []
      parameters:
        - $ref: '#/components/parameters/Accept'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogonRequest'
          application/xml:
            schema:
              $ref: '#/components/schemas/LogonRequest'
      responses:
        '200':
          description: Authentication successful
          headers:
            X-SAP-LogonToken:
              description: Session logon token enclosed in quotes
              schema:
                type: string
                example: '"COMMANDCOM-LCM:6400@{3&2=5697,U3&p=40623.9596541551,Y7&4F&68&z=_3P05,UP&66&UF=02twEaVJw0H1xh3KHPg3S7x.mhc0RWgGLQo1jW.aQbs5Q&42&0F=Ax3kVubd7nkS0DmUxkxGr5J"'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogonResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/LogonResponse'
        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-microcks-operation:
        delay: 200
  /infostore:
    get:
      operationId: browseInfostore
      summary: Browse the infostore
      description: >-
        Browse the top-level infostore repository to discover available
        folders and objects.
      tags:
        - Repository
      parameters:
        - $ref: '#/components/parameters/Accept'
        - $ref: '#/components/parameters/PreferredViewingLanguage'
      responses:
        '200':
          description: Infostore browsing results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InfostoreEntryList'
            application/xml:
              schema:
                $ref: '#/components/schemas/InfostoreEntryList'
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-microcks-operation:
        delay: 150
  /infostore/Root%20Folder/children:
    get:
      operationId: listRootFolderContents
      summary: List root folder contents
      description: >-
        Returns the children of the Root Folder in the infostore repository.
      tags:
        - Repository
      parameters:
        - $ref: '#/components/parameters/Accept'
        - $ref: '#/components/parameters/PreferredViewingLanguage'
      responses:
        '200':
          description: Root folder contents returned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InfostoreEntryList'
            application/xml:
              schema:
                $ref: '#/components/schemas/InfostoreEntryList'
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-microcks-operation:
        delay: 150
  /infostore/{folderId}/children:
    get:
      operationId: listFolderContents
      summary: List folder contents by ID
      description: >-
        Returns the children of a specific folder identified by its
        infostore ID.
      tags:
        - Repository
      parameters:
        - $ref: '#/components/parameters/FolderId'
        - $ref: '#/components/parameters/Accept'
        - $ref: '#/components/parameters/PreferredViewingLanguage'
      responses:
        '200':
          description: Folder contents returned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InfostoreEntryList'
            application/xml:
              schema:
                $ref: '#/components/schemas/InfostoreEntryList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Folder not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-microcks-operation:
        delay: 150
  /infostore/{reportId}/rpt:
    get:
      operationId: getReportSummary
      summary: Get report summary info
      description: >-
        Returns summary information about a Crystal Report including
        name, title, author, format version, and URIs for export,
        service, and edit operations.
      tags:
        - Reports
      parameters:
        - $ref: '#/components/parameters/ReportId'
        - $ref: '#/components/parameters/Accept'
        - $ref: '#/components/parameters/PreferredViewingLanguage'
      responses:
        '200':
          description: Report summary returned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportSummary'
            application/xml:
              schema:
                $ref: '#/components/schemas/ReportSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Report not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-microcks-operation:
        delay: 200
  /infostore/{reportId}/rpt/structure:
    get:
      operationId: getReportStructure
      summary: Get report structure and metadata
      description: >-
        Returns the full structural metadata of a Crystal Report including
        datasources, used fields, group conditions, parameters, summary
        fields, running totals, formulas, and subreports.
      tags:
        - Metadata
      parameters:
        - $ref: '#/components/parameters/ReportId'
        - $ref: '#/components/parameters/Accept'
        - $ref: '#/components/parameters/PreferredViewingLanguage'
      responses:
        '200':
          description: Report structure returned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportStructure'
            application/xml:
              schema:
                $ref: '#/components/schemas/ReportStructure'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Report not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-microcks-operation:
        delay: 300
  /infostore/{reportId}/rpt/instance:
    get:
      operationId: getInstanceForm
      summary: Get instance creation form
      description: >-
        Returns a form template showing the fields needed to create
        a transient report instance, including SuppressData and
        ConnectionInfo options.
      tags:
        - Instances
      parameters:
        - $ref: '#/components/parameters/ReportId'
        - $ref: '#/components/parameters/Accept'
      responses:
        '200':
          description: Instance creation form returned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceForm'
            application/xml:
              schema:
                $ref: '#/components/schemas/InstanceForm'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Report not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-microcks-operation:
        delay: 200
    post:
      operationId: createReportInstance
      summary: Create transient report instance
      description: >-
        Creates a transient report instance by submitting the instance
        creation form with optional SuppressData and ConnectionInfo
        settings. Returns a resource URI for the created instance.
      tags:
        - Instances
      parameters:
        - $ref: '#/components/parameters/ReportId'
        - $ref: '#/components/parameters/Accept'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstanceForm'
          application/xml:
            schema:
              $ref: '#/components/schemas/InstanceForm'
      responses:
        '201':
          description: Report instance created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportInstance'
            application/xml:
              schema:
                $ref: '#/components/schemas/ReportInstance'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Report not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-microcks-operation:
        delay: 500
  /infostore/{reportId}/rpt/export:
    get:
      operationId: exportReport
      summary: Export report to specified format
      description: >-
        Exports a Crystal Report to the specified MIME type format.
        Supports PDF, CSV, Excel, Word, RTF, TTX, XML, plain text,
        and modern Excel (XLSX) formats.
      tags:
        - Export
      parameters:
        - $ref: '#/components/parameters/ReportId'
        - name: mime_type
          in: query
          required: true
          description: The MIME type of the desired export format
          schema:
            type: string
            enum:
              - application/PDF
              - text/csv
              - application/vnd.ms-excel
              - application/msword
              - application/rtf
              - text/ttx
              - application/xml
              - text/plain
              - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
            example: application/PDF
        - name: startPageNumber
          in: query
          required: false
          description: Starting page number for the export (PDF only)
          schema:
            type: integer
            minimum: 1
            example: 1
        - name: endPageNumber
          in: query
          required: false
          description: Ending page number for the export (PDF only)
          schema:
            type: integer
            minimum: 1
            example: 10
        - name: isCreateBookmarksFromGroupTree
          in: query
          required: false
          description: Whether to create bookmarks from the group tree (PDF only)
          schema:
            type: boolean
            example: true
      responses:
        '200':
          description: Report exported successfully
          content:
            application/PDF:
              schema:
                type: string
                format: binary
            text/csv:
              schema:
                type: string
            application/vnd.ms-excel:
              schema:
                type: string
                format: binary
            application/msword:
              schema:
                type: string
                format: binary
            application/rtf:
              schema:
                type: string
            text/ttx:
              schema:
                type: string
            application/xml:
              schema:
                type: string
                format: binary
            text/plain:
              schema:
                type: string
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Report not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-microcks-operation:
        delay: 1000
  /infostore/{reportId}/rpt/data.svc:
    get:
      operationId: getODataServiceDocument
      summary: Get OData service document
      description: >-
        Returns the OData service document listing available collections
        (Rows and GrandTotals) for the specified report.
      tags:
        - OData
      parameters:
        - $ref: '#/components/parameters/ReportId'
        - $ref: '#/components/parameters/Accept'
      responses:
        '200':
          description: OData service document returned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ODataServiceDocument'
            application/xml:
              schema:
                $ref: '#/components/schemas/ODataServiceDocument'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Report not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-microcks-operation:
        delay: 200
  /infostore/{reportId}/rpt/data.svc/$metadata:
    get:
      operationId: getODataMetadata
      summary: Get EDMX metadata document
      description: >-
        Returns the OData EDMX metadata document describing the entity
        types, properties, and associations for the report data service.
      tags:
        - OData
      parameters:
        - $ref: '#/components/parameters/ReportId'
      responses:
        '200':
          description: EDMX metadata document returned successfully
          content:
            application/xml:
              schema:
                type: string
                example: >-
                  <?xml version="1.0" encoding="utf-8"?>
                  <edmx:Edmx Version="1.0"
                  xmlns:edmx="http://schemas.microsoft.com/ado/2007/06/edmx">
                  </edmx:Edmx>
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Report not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-microcks-operation:
        delay: 200
  /infostore/{reportId}/rpt/data.svc/Rows:
    get:
      operationId: getReportDataRows
      summary: Get report data rows
      description: >-
        Returns report data rows via OData. Supports paging with $skip
        and $skiptoken, row counting with $inlinecount and $count,
        field selection with $select, and parameter filtering.
      tags:
        - OData
      parameters:
        - $ref: '#/components/parameters/ReportId'
        - $ref: '#/components/parameters/Accept'
        - name: $skip
          in: query
          required: false
          description: Number of rows to skip
          schema:
            type: integer
            minimum: 0
            example: 0
        - name: $skiptoken
          in: query
          required: false
          description: Token for server-driven paging
          schema:
            type: string
            example: '100'
        - name: $inlinecount
          in: query
          required: false
          description: Include total count in response
          schema:
            type: string
            enum:
              - allpages
            example: allpages
        - name: $count
          in: query
          required: false
          description: Return only the count of rows
          schema:
            type: boolean
            example: true
        - name: $select
          in: query
          required: false
          description: Comma-separated list of fields to include
          schema:
            type: string
            example: 'CustomerName,OrderAmount'
      responses:
        '200':
          description: Report data rows returned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ODataRowCollection'
            application/xml:
              schema:
                $ref: '#/components/schemas/ODataRowCollection'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Report not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-microcks-operation:
        delay: 500
    post:
      operationId: pushDataRow
      summary: Push a row of data to transient instance
      description: >-
        Pushes a row of data to a transient report instance for
        data-driven report generation.
      tags:
        - OData
      parameters:
        - $ref: '#/components/parameters/ReportId'
        - $ref: '#/components/parameters/Accept'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ODataRow'
          application/xml:
            schema:
              $ref: '#/components/schemas/ODataRow'
      responses:
        '201':
          description: Data row pushed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ODataRow'
            application/xml:
              schema:
                $ref: '#/components/schemas/ODataRow'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Report not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-microcks-operation:
        delay: 300
  /infostore/{reportId}/rpt/data.svc/Rows({index}):
    get:
      operationId: getReportDataRowByIndex
      summary: Get specific row by index
      description: >-
        Returns a single report data row identified by its zero-based
        index within the Rows collection.
      tags:
        - OData
      parameters:
        - $ref: '#/components/parameters/ReportId'
        - name: index
          in: path
          required: true
          description: Zero-based index of the row
          schema:
            type: integer
            minimum: 0
            example: 0
        - $ref: '#/components/parameters/Accept'
      responses:
        '200':
          description: Data row returned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ODataRow'
            application/xml:
              schema:
                $ref: '#/components/schemas/ODataRow'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Row not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-microcks-operation:
        delay: 200
  /infostore/{reportId}/rpt/data.svc/Rows({index})/{fieldName}:
    get:
      operationId: getRowFieldValue
      summary: Get specific field from row
      description: >-
        Returns the value of a specific field from a report data row,
        wrapped in OData format.
      tags:
        - OData
      parameters:
        - $ref: '#/components/parameters/ReportId'
        - name: index
          in: path
          required: true
          description: Zero-based index of the row
          schema:
            type: integer
            minimum: 0
            example: 0
        - name: fieldName
          in: path
          required: true
          description: Name of the field to retrieve
          schema:
            type: string
            example: CustomerName
        - $ref: '#/components/parameters/Accept'
      responses:
        '200':
          description: Field value returned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ODataFieldValue'
            application/xml:
              schema:
                $ref: '#/components/schemas/ODataFieldValue'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Row or field not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-microcks-operation:
        delay: 200
  /infostore/{reportId}/rpt/data.svc/Rows({index})/{fieldName}/$value:
    get:
      operationId: getRowFieldRawValue
      summary: Get raw field value
      description: >-
        Returns the raw, unwrapped value of a specific field from a
        report data row as plain text.
      tags:
        - OData
      parameters:
        - $ref: '#/components/parameters/ReportId'
        - name: index
          in: path
          required: true
          description: Zero-based index of the row
          schema:
            type: integer
            minimum: 0
            example: 0
        - name: fieldName
          in: path
          required: true
          description: Name of the field to retrieve
          schema:
            type: string
            example: OrderAmount
        - $ref: '#/components/parameters/Accept'
      responses:
        '200':
          description: Raw field value returned successfully
          content:
            text/plain:
              schema:
                type: string
                example: '1250.50'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Row or field not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-microcks-operation:
        delay: 150
  /infostore/{reportId}/rpt/data.svc/GrandTotals:
    get:
      operationId: getGrandTotals
      summary: Get grand totals
      description: >-
        Returns the grand total summary fields for the report data,
        including aggregated values across all rows.
      tags:
        - OData
      parameters:
        - $ref: '#/components/parameters/ReportId'
        - $ref: '#/components/parameters/Accept'
      responses:
        '200':
          description: Grand totals returned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GrandTotalCollection'
            application/xml:
              schema:
                $ref: '#/components/schemas/GrandTotalCollection'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Report not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-microcks-operation:
        delay: 300
  /infostore/{reportId}/rpt/data.svc/{GroupName}:
    get:
      operationId: getGroupData
      summary: Get group data
      description: >-
        Returns data for a specific group within the report. Group names
        correspond to the group conditions defined in the report structure.
      tags:
        - OData
      parameters:
        - $ref: '#/components/parameters/ReportId'
        - name: GroupName
          in: path
          required: true
          description: Name of the group collection
          schema:
            type: string
            example: Group1_Country
        - $ref: '#/components/parameters/Accept'
      responses:
        '200':
          description: Group data returned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ODataRowCollection'
            application/xml:
              schema:
                $ref: '#/components/schemas/ODataRowCollection'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Group not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-microcks-operation:
        delay: 300
  /infostore/{reportId}/rpt/data.svc/{GroupName}('{groupPath}'):
    get:
      operationId: getGroupByPath
      summary: Get specific group by path
      description: >-
        Returns data for a specific group entry identified by its
        group path string within the named group collection.
      tags:
        - OData
      parameters:
        - $ref: '#/components/parameters/ReportId'
        - name: GroupName
          in: path
          required: true
          description: Name of the group collection
          schema:
            type: string
            example: Group1_Country
        - name: groupPath
          in: path
          required: true
          description: Path identifier for the specific group entry
          schema:
            type: string
            example: USA
        - $ref: '#/components/parameters/Accept'
      responses:
        '200':
          description: Group entry returned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ODataRow'
            application/xml:
              schema:
                $ref: '#/components/schemas/ODataRow'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Group entry not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-microcks-operation:
        delay: 200
components:
  securitySchemes:
    sapLogonToken:
      type: apiKey
      name: X-SAP-LogonToken
      in: header
      description: >-
        SAP logon token obtained from the /logon/long endpoint. The token
        value must be enclosed in double quotes when sent in the header.
    basicAuth:
      type: http
      scheme: basic
      description: HTTP Basic authentication as an alternative to token-based auth
  parameters:
    ReportId:
      name: reportId
      in: path
      required: true
      description: Infostore object ID of the Crystal Report
      schema:
        type: integer
        example: 5765
    FolderId:
      name: folderId
      in: path
      required: true
      description: Infostore object ID of the folder
      schema:
        type: integer
        example: 4201
    Accept:
      name: Accept
      in: header
      required: false
      description: Desired response format
      schema:
        type: string
        enum:
          - application/json
          - application/xml
        default: application/json
        example: application/json
    PreferredViewingLanguage:
      name: X-SAP-PVL
      in: header
      required: false
      description: Preferred viewing language for localized content
      schema:
        type: string
        example: en
  responses:
    Unauthorized:
      description: Authentication required or token expired
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    LogonRequest:
      type: object
      description: Logon credentials for authenticating against the BI Platform
      properties:
        userName:
          type: string
          description: Username for authentication
          example: Administrator
        password:
          type: string
          description: Password for the user account
          example: P@ssw0rd
        auth:
          type: string
          description: Authentication type to use
          enum:
            - secEnterprise
            - secLDAP
            - secWinAD
            - secSAPR3
          example: secEnterprise
      required:
        - userName
        - password
        - auth
    LogonResponse:
      type: object
      description: Response containing the logon token after successful authentication
      properties:
        logonToken:
          type: string
          description: Session token for subsequent API calls (include in X-SAP-LogonToken header with quotes)
          example: 'COMMANDCOM-LCM:6400@{3&2=5697,U3&p=40623.9596541551,Y7&4F&68&z=_3P05,UP&66&UF=02twEaVJw0H1xh3KHPg3S7x.mhc0RWgGLQo1jW.aQbs5Q&42&0F=Ax3kVubd7nkS0DmUxkxGr5J'
    InfostoreEntry:
      type: object
      description: An object in the infostore repository (folder, report, etc.)
      properties:
        id:
          type: integer
          description: Unique infostore object identifier
          example: 5765
        cuid:
          type: string
          description: Cluster unique identifier
          example: AaGKDkx9w5RMoGANrfKwmn0
        name:
          type: string
          description: Display name of the object
          example: Sales Report Q4
        type:
          type: string
          description: Object type (e.g., Folder, CrystalReport)
          example: CrystalReport
        description:
          type: string
          description: Object description
          example: Quarterly sales report for all regions
        uri:
          type: string
          description: Relative URI to access this object
          example: /biprws/infostore/5765
    InfostoreEntryList:
      type: object
      description: A collection of infostore entries
      properties:
        entries:
          type: array
          description: List of infostore objects
          items:
            $ref: '#/components/schemas/InfostoreEntry'
          example:
            - id: 4201
              cuid: AaGKDkx9w5RMoGANrfKwmn0
              name: Report Samples
              type: Folder
              description: Sample Crystal Reports
              uri: /biprws/infostore/4201
    ReportSummary:
      type: object
      description: Summary information about a Crystal Report
      properties:
        report_name:
          type: string
          description: Internal name of the report
          example: WorldSalesReport.rpt
        report_title:
          type: string
          description: Display title of the report
          example: World Sales Report
        file_format_version:
          $ref: '#/components/schemas/FileFormatVersion'
        author:
          type: string
          description: Author of the report
          example: John Smith
        subject:
          type: string
          description: Subject of the report
          example: Global Sales Data
        keywords:
          type: string
          description: Keywords associated with the report
          example: sales, quarterly, revenue
        comments:
          type: string
          description: Comments about the report
          example: Updated for Q4 2023 data
        last_data_refresh_date:
          type: string
          format: date-time
          description: Last time the report data was refreshed
          example: '2023-12-15T14:30:00Z'
        export_uri:
          type: string
          description: URI for exporting the report
          example: /biprws/infostore/5765/rpt/export
        service_uri:
          type: string
          description: URI for the OData data service
          example: /biprws/infostore/5765/rpt/data.svc
        edit_uri:
          type: string
          description: URI for editing or managing the report
          example: /biprws/infostore/5765/rpt/instance
    FileFormatVersion:
      type: object
      description: Crystal Report file format version
      properties:
        major_version:
          type: integer
          description: Major version number
          example: 14
        minor_version:
          type: integer
          description: Minor version number
          example: 3
    ReportStructure:
      type: object
      description: Full structural metadata of a Crystal Report
      properties:
        datasources:
          type: array
          description: Data sources used by the report
          items:
            $ref: '#/components/schemas/DataSource'
        usedfields:
          type: array
          description: Fields used in the report
          items:
            $ref: '#/components/schemas/UsedField'
        groupconditions:
          type: array
          description: Group conditions defined in the report
          items:
            $ref: '#/components/schemas/GroupCondition'
        parameters:
          type: array
          description: Report parameters
          items:
            $ref: '#/components/schemas/ReportParameter'
        summary:
          type: array
          description: Summary fields in the report
          items:
            $ref: '#/components/schemas/SummaryField'
        runningtotals:
          type: array
          description: Running total fields
          items:
            $ref: '#/components/schemas/RunningTotal'
        formulas:
          type: array
          description: Formula fields defined in the report
          items:
            $ref: '#/components/schemas/Formula'
        subreports:
          type: array
          description: Subreports embedded in the report
          items:
            $ref: '#/components/schemas/Subreport'
    DataSource:
      type: object
      description: A data source connection used by the report
      properties:
        name:
          type: string
          description: Name of the data source
          example: xtreme
        type:
          type: string
          description: Type of data source connection
          example: JDBC (JNDI)
        tables:
          type: array
          description: Tables used from this data source
          items:
            type: string
          example:
            - Customer
            - Orders
    UsedField:
      type: object
      description: A field used in the report
      properties:
        name:
          type: string
          description: Field name
          example: Customer Name
        table:
          type: string
          description: Table the field belongs to
          example: Customer
        type:
          type: string
          description: Data type of the field
          example: String
    GroupCondition:
      type: object
      description: A group condition defining how report data is grouped
      properties:
        field:
          type: string
          description: Field used for grouping
          example: Country
        direction:
          type: string
          description: Sort direction of the group
          enum:
            - Ascending
            - Descending
          example: Ascending
    ReportParameter:
      type: object
      description: A parameter that can be set when running the report
      properties:
        name:
          type: string
          description: Parameter name
          example: StartDate
        type:
          type: string
          description: Data type of the parameter
          example: Date
        prompt:
          type: string
          description: Prompt text shown to the user
          example: Enter the start date
        required:
          type: boolean
          description: Whether the parameter is required
          example: true
        default_value:
          type: string
          description: Default value for the parameter
          example: '2023-01-01'
    SummaryField:
      type: object
      description: A summary or aggregate field in the report
      properties:
        name:
          type: string
          description: Summary field name
          example: Sum of Order Amount
        operation:
          type: string
          description: Aggregation operation
          example: Sum
        field:
          type: string
          description: Source field being summarized
          example: Order Amount
    RunningTotal:
      type: object
      description: A running total field
      properties:
        name:
          type: string
          description: Running total field name
          example: RunningTotal_OrderAmount
        field:
          type: string
          description: Field being totaled
          example: Order Amount
        operation:
          type: string
          description: Aggregation operation
          example: Sum
        reset_condition:
          type: string
          description: Condition that resets the running total
          example: OnGroupChange
    Formula:
      type: object
      description: A formula field defined in the report
      properties:
        name:
          type: string
          description: Formula field name
          example: FullAddress
        text:
          type: string
          description: Formula expression text
          example: '{Customer.Address1} & ", " & {Customer.City}'
    Subreport:
      type: object
      description: A subreport embedded within the main report
      properties:
        name:
          type: string
          description: Subreport name
          example: OrderDetails
        uri:
          type: string
          description: URI to access the subreport
          example: /biprws/infostore/5765/rpt/subreport/OrderDetails
    InstanceForm:
      type: object
      description: Form for creating a transient report instance
      properties:
        SuppressData:
          type: boolean
          description: Whether to suppress data retrieval during instance creation
          example: false
        ConnectionInfo:
          $ref: '#/components/schemas/ConnectionInfo'
    ConnectionInfo:
      type: object
      description: Database connection information for the report instance
      properties:
        userName:
          type: string
          description: Database username
          example: db_user
        password:
          type: string
          description: Database password
          example: db_pass
        serverName:
          type: string
          description: Database server name or address
          example: dbserver.example.com
        databaseName:
          type: string
          description: Database name
          example: SalesDB
    ReportInstance:
      type: object
      description: A transient report instance
      properties:
        report_name:
          type: string
          description: Name of the report
          example: WorldSalesReport.rpt
        resource:
          type: string
          description: URI of the created instance resource
          example: /biprws/infostore/5765/rpt/instance/abc123
        id:
          type: string
          description: Unique identifier of the instance
          example: abc123
    ODataServiceDocument:
      type: object
      description: OData service document listing available collections
      properties:
        EntitySets:
          type: array
          description: Available entity set collections
          items:
            type: string
          example:
            - Rows
            - GrandTotals
    ODataRow:
      type: object
      description: >-
        A single row of report data. Properties are dynamic and correspond
        to the fields defined in the report.
      additionalProperties: true
      example:
        CustomerName: City Cyclists
        Country: USA
        OrderAmount: 1250.50
        OrderDate: '2023-11-15'
    ODataRowCollection:
      type: object
      description: A collection of OData report data rows
      properties:
        __count:
          type: string
          description: Total count of rows (when $inlinecount=allpages is used)
          example: '1542'
        __next:
          type: string
          description: URI for the next page of results
          example: /biprws/infostore/5765/rpt/data.svc/Rows?$skiptoken=100
        value:
          type: array
          description: Array of data rows
          items:
            $ref: '#/components/schemas/ODataRow'
          example:
            - CustomerName: City Cyclists
              Country: USA
              OrderAmount: 1250.50
              OrderDate: '2023-11-15'
            - CustomerName: Pathfinders
              Country: Canada
              OrderAmount: 875.25
              OrderDate: '2023-11-16'
    ODataFieldValue:
      type: object
      description: A single field value from an OData row
      properties:
        fieldName:
          type: string
          description: Name of the field
          example: CustomerName
        value:
          type: string
          description: Value of the field
          example: City Cyclists
    GrandTotal:
      type: object
      description: >-
        Grand total summary data. Properties are dynamic and correspond
        to the summary fields defined in the report.
      additionalProperties: true
      example:
        SumOfOrderAmount: 548290.75
        CountOfOrders: 1542
        AverageOrderAmount: 355.57
    GrandTotalCollection:
      type: object
      description: Collection of grand total summary entries
      properties:
        value:
          type: array
          description: Array of grand total entries
          items:
            $ref: '#/components/schemas/GrandTotal'
          example:
            - SumOfOrderAmount: 548290.75
              CountOfOrders: 1542
              AverageOrderAmount: 355.57
    Error:
      type: object
      description: Error response from the API
      properties:
        error_code:
          type: integer
          description: Numeric error code
          example: 401
        message:
          type: string
          description: Human-readable error message
          example: Authentication token is missing or expired
